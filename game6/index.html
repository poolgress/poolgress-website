<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Poolgress 遊戲</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 畫面 0：沒有可玩關卡（入口只有編輯器的「開始流程」） -->
  <section id="screenEmpty" hidden>
    <h1>Poolgress 遊戲</h1>
    <p id="emptyMsg">還沒有關卡：請在編輯器（/table6/）按「輸出 → 開始流程」進入遊戲。</p>
  </section>

  <!-- 畫面 1：關卡說明（開始流程直接進到這裡） -->
  <section id="screenInfo" hidden>
    <h2 id="infoName"></h2>
    <img id="infoImage" class="level-image" alt="球型圖" hidden />
    <p id="infoDesc"></p>
    <p id="infoCond"></p>
    <p id="infoStars"></p>
    <button id="startBtn" class="primary">開始遊戲</button>
  </section>

  <!-- 畫面 3：關卡進行 -->
  <section id="screenPlay" hidden>
    <header class="play-top">
      <button class="back" id="playBack">←</button>
      <span id="playTitle"></span>
      <button id="playHelp">?</button>
    </header>
    <div id="statusBar"></div>
    <div id="noticeBar" hidden></div>
    <div id="tableOuter"><div id="tableRotor">
      <img id="tableImg" alt="" draggable="false" />
      <img id="cushionImg" alt="" draggable="false" />
      <svg id="overlay"></svg>
    </div>
      <!-- 大字提示（擺球/開始擊球）與本桿結果宣告：蓋在球桌上（流程圖 6.3/6.5/6.9） -->
      <div id="tableHint" class="table-hint" hidden></div>
      <div id="shotMsg" class="shot-msg" hidden></div>
    </div>
    <div id="attemptRow"></div>
    <div id="cvPanel"></div>
    <div id="helpOverlay" hidden>
      <div class="help-panel">
        <h3 id="helpName"></h3><p id="helpDesc"></p><p id="helpCond"></p>
        <button id="helpClose">關閉</button>
      </div>
    </div>
    <!-- 放棄確認（取代 confirm；流程圖側分支：放棄→說明頁、繼續玩→原狀態） -->
    <div id="quitOverlay" hidden>
      <div class="help-panel quit-panel">
        <h3>要放棄遊戲嗎？</h3>
        <div class="quit-actions">
          <button id="quitStay">繼續玩</button>
          <button id="quitYes" class="danger">放棄</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 畫面 4：結算 -->
  <section id="screenEnd" hidden>
    <h2 id="endName">結算</h2>
    <p id="endStarsBig" class="end-stars"></p>
    <img id="endImage" class="level-image" alt="球型圖" hidden />
    <div id="endAttempts"></div>
    <p id="endScore"></p>
    <p id="endPass"></p>
    <p id="endStars" hidden></p>
    <button id="replayBtn" class="primary">再玩一次</button>
    <button id="endBack">回關卡說明</button>
  </section>

  <script src="config.js"></script>
  <script src="level-schema.js"></script>
  <script src="levels.js"></script>
  <script src="judge.js"></script>
  <script src="machine.js"></script>
  <script src="cv-manual.js"></script>
  <script src="audio.js"></script>
  <script src="render.js"></script>
  <script src="main.js"></script>
</body>
</html>
