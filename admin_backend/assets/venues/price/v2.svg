">平均 NT$95/時</text><line x1="70" y1="720" x2="530" y2="720" stroke="#F4F1E8" stroke-opacity=".3" stroke-dasharray="6 6"/><text x="70" y="756" font-size="30" fill="#F4F1E8">整晚包台</text><text x="530" y="756" font-size="32" font-weight="700" fill="#F2C94C" text-anchor="end">NT$600</text><text x="70" y="786" font-size="20" fill="#F4F1E8" opacity=".65">23:00–05:00</text><line x1="70" y1="804" x2="530" y2="804" stroke="#F4F1E8" stroke-opacity=".3" stroke-dasharray="6 6"/>
