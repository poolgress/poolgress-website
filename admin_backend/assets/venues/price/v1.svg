<rect x="50" y="156" width="500" height="48" rx="10" fill="#FF4FB3" fill-opacity=".15"/><text x="70" y="190" font-size="30" font-weight="800" fill="#FF4FB3">一般檯費</text><text x="70" y="256" font-size="30" fill="#E9E7FF">平日 18:00 前</text><text x="530" y="256" font-size="32" font-weight="700" fill="#FF4FB3" text-anchor="end">NT$120/時</text><line x1="70" y1="282" x2="530" y2="282" stroke="#6C63FF" stroke-opacity=".3" stroke-dasharray="6 6"/><text x="70" y="318" font-size="30" fill="#E9E7FF">平日 18:00 後</text><text x="530" y="318" font-size="32" font-weight="700" fill="#FF4FB3" text-anchor="end">NT$150/時</text><line x1="70" y1="344" x2="530" y2="344" stroke="#6C63FF" stroke-opacity=".3" stroke-dasharray="6 6"/><text x="70" y="380" font-size="30" fill="#E9E7FF">假日全天</text><text x="530" y="380" font-size="32" font-weight="700" fill="#FF4FB3" text-anchor="end">NT$160/時</text><line x1="70" y1="406" x2="530" y2="406" stroke="#6C63FF" stroke-opacity=".3" stroke-dasharray="6 6"/><text x="70" y="442" font-size="30" fill="#E9E7FF">Poolgress 球桌</text><text x="530" y="442" font-size="32" font-weight="700" fill="#FF4FB3" text-anchor="end">不另收費</text><text x="70" y="472" font-size="20" fill="#E9E7FF" opacity=".65">掃碼即可開始闖關</text><line x1="70" y1="490" x2="530" y2="490" stroke="#6C63FF" stroke-opacity=".3" stroke-dasharray="6 6"/><rect x="50" y="532" width="500" height="48" rx="10" fill="#FF4FB3" fill-opacity=".15"/><text x="70" y="566" font-size="30" font-weight="800" fill="#FF4FB3">包台優惠</text><text x="530" y="566" font-size="20" fill="#E9E7FF" opacity=".7" text-anchor="end">限平日 11:00–18:00</text><text x="70" y="632" font-size="30" fill="#E9E7FF">包台 3 小時</text><text x="530" y="632" font-size="32" font-weight="700" fill="#FF4FB3" text-anchor="end">NT$300</text><text x="70" y="662" font-size="20" fill="#E9E7FF" opacity=".65">現省 NT$60</text><line x1="70" y1="680" x2="530" y2="680" stroke="#6C63FF" stroke-opacity=".3" stroke-dasharray="6 6"/><text x="70" y="716" font-size="30" fill="#E9E7FF">包台 5 小時</text><text x="530" y="716" font-size="32" font-weight="700" fill="#FF4FB3" text-anchor="end">NT$480</text><text x="70" y="746" font-size="20" fill="#E9E7FF" opacity=".65">送飲料一杯</text><line x1="70" y1="764" x2="530" y2="764" stroke="#6C63FF" stroke-opacity=".3" stroke-dasharray="6 6"/><text x="70" y="800" font-size="30" fill="#E9E7FF">學生包台</text><text x="530" y="800" font-size="32" font-weight="700" fill="#FF4FB3" text-anchor="end">NT$250/3時</text><text x="70" y="830" font-size="20" fill="#E9E7FF" opacity=".65">須出示學生證</text><line x1="70" y1="848" x2="530" y2="848" stroke="#6C63FF" stroke-opacity=".3" stroke-dasharray="6 6"/>
