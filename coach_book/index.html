<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找教練｜PoolGress</title>
<meta name="description" content="告訴我們你想學什麼，PoolGress 幫你配對合適的撞球教練。">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<!-- 教練申請（2026-09-30）：送到 Supabase Edge Function coach-requests → 存進 coach_requests、推播到團隊 LINE 群組；後台「教練申請」頁處理
     App「我要找官方教練」開的是這頁（?from=app）；?coach=王教練 會自動填「指定教練」 -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#3b82f6;--blue-dark:#2563eb;--bg:#f0f6ff;--text:#1e3a5f;--text2:#4b6a8f;--line:#d6e4f5;--danger:#dc2626;--green:#06c755}
body{font-family:'Nunito','Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
nav{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);padding:1rem 1.5rem;box-shadow:0 2px 12px rgba(0,0,0,.06)}
nav a{color:var(--blue);text-decoration:none;font-weight:900;font-size:1.15rem}
main{max-width:560px;margin:0 auto;padding:2rem 1rem 4rem}
h1{font-size:1.6rem;margin-bottom:.25rem}
.lead{color:var(--text2);margin-bottom:1.5rem}
.card{background:#fff;border-radius:16px;padding:1.25rem;box-shadow:0 2px 12px rgba(30,58,95,.06);margin-bottom:1rem}
.card h2{font-size:1.05rem;margin-bottom:.75rem}
.field{display:flex;flex-direction:column;gap:.35rem;margin-top:.9rem}
.field:first-of-type{margin-top:0}
.label{font-weight:700;font-size:.95rem}
.label small{font-weight:400;color:var(--text2);margin-left:.35rem}
input[type=text],input[type=tel],textarea{width:100%;font:inherit;font-size:16px;padding:.65rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
input:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:96px}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-block;padding:.45rem .95rem;border:1.5px solid var(--line);border-radius:99px;font-size:.95rem;background:#fff;user-select:none}
.chip input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.hint{font-size:.85rem;color:var(--text2)}
.error{color:var(--danger);font-size:.9rem;margin-top:.5rem}
.captcha{margin:1rem 0 .25rem;min-height:65px}
.btn{display:block;width:100%;padding:.9rem;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
.btn:hover{background:var(--blue-dark)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.line{background:var(--green)}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--line)}
.done{text-align:center}
.done .icon{font-size:3rem;line-height:1;margin-bottom:.5rem}
.done p{color:var(--text2);margin:.5rem 0 1.25rem}
.done .btn+.btn{margin-top:.75rem}
.privacy{font-size:.85rem;color:var(--text2);margin-top:.75rem}
.privacy a{color:var(--blue)}
[hidden]{display:none!important}
</style>
</head>
<body>
<nav><a href="/">PoolGress</a></nav>
<main>
  <section id="form-view">
    <h1>找教練</h1>
    <p class="lead">告訴我們你想學什麼，我們幫你配對合適的教練，1–2 個工作天內用 LINE 或電話聯絡你。</p>

    <form id="form" novalidate>
      <div class="card">
        <h2>怎麼稱呼你</h2>
        <label class="field">
          <span class="label">稱呼</span>
          <input type="text" name="nickname" maxlength="40" autocomplete="nickname" placeholder="例如：小明" required>
        </label>
        <label class="field">
          <span class="label">LINE ID<small>LINE ID 和手機至少填一個</small></span>
          <input type="text" name="lineId" maxlength="60" autocomplete="off" placeholder="你的 LINE ID">
        </label>
        <label class="field">
          <span class="label">手機</span>
          <input type="tel" name="phone" maxlength="30" autocomplete="tel" placeholder="09xx-xxx-xxx">
        </label>
      </div>

      <div class="card">
        <h2>你的需求</h2>
        <div class="field">
          <span class="label">目前程度</span>
          <div class="chips">
            <label class="chip"><input type="radio" name="level" value="first"><span>第一次打</span></label>
            <label class="chip"><input type="radio" name="level" value="casual"><span>偶爾打</span></label>
            <label class="chip"><input type="radio" name="level" value="practicing"><span>有在練</span></label>
          </div>
        </div>
        <div class="field">
          <span class="label">想學什麼<small>可以複選</small></span>
          <div class="chips">
            <label class="chip"><input type="checkbox" name="topics" value="stance"><span>基本姿勢</span></label>
            <label class="chip"><input type="checkbox" name="topics" value="aiming"><span>瞄準</span></label>
            <label class="chip"><input type="checkbox" name="topics" value="position"><span>走位</span></label>
            <label class="chip"><input type="checkbox" name="topics" value="competition"><span>比賽準備</span></label>
            <label class="chip"><input type="checkbox" name="topics" value="other"><span>其他</span></label>
          </div>
        </div>
        <label class="field">
          <span class="label">希望的地區或球館</span>
          <input type="text" name="area" maxlength="60" placeholder="例如：台北市信義區、波格思虛擬撞球館">
        </label>
        <div class="field">
          <span class="label">方便的時段<small>可以複選</small></span>
          <div class="chips">
            <label class="chip"><input type="checkbox" name="timeSlots" value="weekday_day"><span>平日白天</span></label>
            <label class="chip"><input type="checkbox" name="timeSlots" value="weekday_night"><span>平日晚上</span></label>
            <label class="chip"><input type="checkbox" name="timeSlots" value="weekend"><span>週末</span></label>
          </div>
        </div>
        <label class="field">
          <span class="label">指定教練<small>選填，沒有就由我們幫你配</small></span>
          <input type="text" name="preferredCoach" maxlength="40" placeholder="例如：王教練">
        </label>
        <label class="field">
          <span class="label">補充說明<small>選填</small></span>
          <textarea name="message" maxlength="500" placeholder="想讓教練知道的事，例如想準備比賽、之前學過多久"></textarea>
        </label>
      </div>

      <div class="captcha" id="captcha"></div>
      <p class="error" id="error" role="alert" hidden></p>
      <button class="btn" id="submit" type="submit">送出申請</button>
      <p class="privacy">送出即表示你同意我們用你留下的聯絡方式，聯絡你安排教練。詳見<a href="/privacy.html">隱私政策</a>。</p>
    </form>
  </section>

  <section id="done-view" class="card done" hidden>
    <div class="icon">🎱</div>
    <h1>已收到你的申請！</h1>
    <p>我們會在 1–2 個工作天內用 LINE 或電話聯絡你。<br>先加入 PoolGress 官方 LINE，我們才傳得了訊息給你。</p>
    <a class="btn line" href="https://lin.ee/QL02rCh" target="_blank" rel="noopener">加入 PoolGress 官方 LINE</a>
    <a class="btn ghost" id="download" href="/">下載 PoolGress App</a>
  </section>
</main>

<script>
(() => {
  const FUNCTION_URL = 'https://dojsufuonheobgcdixrm.supabase.co/functions/v1/coach-requests';
  const PUBLISHABLE_KEY = 'sb_publishable_9nHwyeJUaeQXYSqZEDP1YA_H27yrCcu';
  // Cloudflare Turnstile 的 site key（可公開）。本機測試用 Cloudflare 提供的「一定通過」測試金鑰
  const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const TURNSTILE_SITE_KEY = LOCAL ? '1x00000000000000000000AA' : '0x4AAAAAAFKVoDfLLkHgcJQD';
  const CONTACT_KEY = 'pg_coach_contact';

  const params = new URLSearchParams(location.search);
  const fromApp = params.get('from') === 'app';
  const form = document.getElementById('form');
  const submitBtn = document.getElementById('submit');
  const errorEl = document.getElementById('error');

  if (params.get('coach')) form.preferredCoach.value = params.get('coach').slice(0, 40);
  if (fromApp) document.getElementById('download').hidden = true; // 已經在用 App 了
  try {
    const saved = JSON.parse(localStorage.getItem(CONTACT_KEY) || '{}');
    for (const k of ["name", "lineId", "phone"]) if (saved[k]) form[k === "name" ? "nickname" : k].value = saved[k];
  } catch { /* 沒有存過或瀏覽器不給存 */ }

  let captchaToken = '';
  let widgetId = null;
  const showError = (msg) => { errorEl.textContent = msg; errorEl.hidden = !msg; };

  if (!TURNSTILE_SITE_KEY) {
    submitBtn.disabled = true;
    showError('線上申請還在準備中，請先加入官方 LINE 告訴我們你的需求：https://lin.ee/QL02rCh');
  } else {
    const render = () => {
      widgetId = turnstile.render('#captcha', {
        sitekey: TURNSTILE_SITE_KEY,
        language: 'zh-tw',
        theme: 'light',
        callback: (t) => { captchaToken = t; },
        'expired-callback': () => { captchaToken = ''; },
        'error-callback': () => { captchaToken = ''; },
      });
    };
    (function waitTurnstile() { window.turnstile ? render() : setTimeout(waitTurnstile, 100); })();
  }

  const values = (name) => [...form.querySelectorAll(`input[name="${name}"]:checked`)].map((i) => i.value);
  const ERRORS = {
    captcha_failed: '驗證沒有通過，請再試一次。',
    too_many_requests: '送出太多次了，請一小時後再試，或直接加入官方 LINE 聯絡我們。',
    contact_required: '請填 LINE ID 或手機，至少一個。',
    name_required: '請填稱呼。',
    level_required: '請選擇目前程度。',
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
      action: 'submit',
      source: fromApp ? 'app' : 'web',
      name: form.nickname.value.trim(),
      lineId: form.lineId.value.trim(),
      phone: form.phone.value.trim(),
      level: values('level')[0] || '',
      topics: values('topics'),
      area: form.area.value.trim(),
      timeSlots: values('timeSlots'),
      preferredCoach: form.preferredCoach.value.trim(),
      message: form.message.value.trim(),
      turnstileToken: captchaToken,
    };
    if (!body.name) return showError(ERRORS.name_required);
    if (!body.lineId && !body.phone) return showError(ERRORS.contact_required);
    if (!body.level) return showError(ERRORS.level_required);
    if (!captchaToken) return showError('請等驗證完成（上方的方框打勾）再送出。');

    showError('');
    submitBtn.disabled = true;
    submitBtn.textContent = '送出中…';
    try {
      const res = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: PUBLISHABLE_KEY },
        body: JSON.stringify(body),
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(ERRORS[out.error] || '送出失敗，請稍後再試，或直接加入官方 LINE 聯絡我們。');
      try { localStorage.setItem(CONTACT_KEY, JSON.stringify({ name: body.name, lineId: body.lineId, phone: body.phone })); } catch { /* 不存也沒關係 */ }
      document.getElementById('form-view').hidden = true;
      document.getElementById('done-view').hidden = false;
      window.scrollTo(0, 0);
    } catch (err) {
      showError(err.message);
      captchaToken = '';
      if (widgetId !== null) turnstile.reset(widgetId); // Turnstile 的 token 只能用一次
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '送出申請';
    }
  });
})();
</script>
</body>
</html>
